<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0505"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc2200"/>
      <stop offset="100%" style="stop-color:#ff4422"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top red bar -->
  <rect width="1200" height="6" fill="url(#accent)"/>

  <!-- Left accent stripe -->
  <rect x="60" y="60" width="4" height="510" fill="#cc2200" opacity="0.6"/>

  <!-- Site name -->
  <text x="88" y="140" font-family="'Arial Black', 'Impact', sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="4" text-transform="uppercase">HIGH-SPEED FAIL</text>

  <!-- Divider -->
  <rect x="88" y="160" width="600" height="2" fill="#cc2200"/>

  <!-- Subhead -->
  <text x="88" y="205" font-family="'Courier New', monospace" font-size="22" fill="#999999" letter-spacing="2">CALIFORNIA HIGH-SPEED RAIL — PUBLIC ACCOUNTABILITY</text>

  <!-- Stat 1 -->
  <text x="88" y="300" font-family="'Arial Black', Impact, sans-serif" font-size="80" font-weight="900" fill="#ff4422">$13.8B</text>
  <text x="88" y="336" font-family="'Courier New', monospace" font-size="20" fill="#888888" letter-spacing="1">SPENT BY TAXPAYERS</text>

  <!-- Stat 2 -->
  <text x="88" y="420" font-family="'Arial Black', Impact, sans-serif" font-size="80" font-weight="900" fill="#ffffff">0</text>
  <text x="88" y="456" font-family="'Courier New', monospace" font-size="20" fill="#888888" letter-spacing="1">PASSENGERS CARRIED</text>

  <!-- Right side stats -->
  <text x="700" y="300" font-family="'Arial Black', Impact, sans-serif" font-size="48" font-weight="900" fill="#cc4444">CEO ARRESTED</text>
  <text x="700" y="336" font-family="'Courier New', monospace" font-size="18" fill="#666666">FEB 2026</text>

  <text x="700" y="400" font-family="'Arial Black', Impact, sans-serif" font-size="48" font-weight="900" fill="#cc4444">$537M</text>
  <text x="700" y="436" font-family="'Courier New', monospace" font-size="18" fill="#666666">SECRET SETTLEMENT</text>

  <text x="700" y="500" font-family="'Arial Black', Impact, sans-serif" font-size="48" font-weight="900" fill="#cc4444">$4B</text>
  <text x="700" y="536" font-family="'Courier New', monospace" font-size="18" fill="#666666">FEDERAL FUNDING TERMINATED</text>

  <!-- Bottom bar -->
  <rect x="0" y="576" width="1200" height="54" fill="#111111"/>
  <text x="88" y="612" font-family="'Courier New', monospace" font-size="24" fill="#cc2200" letter-spacing="3" font-weight="bold">highspeedfail.com</text>
  <text x="1100" y="612" font-family="'Courier New', monospace" font-size="16" fill="#444444" text-anchor="end">DATA. ACCOUNTABILITY. PUBLIC RECORD.</text>
</svg>
